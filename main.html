<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest-like Hero Section</title>
    <!-- Tailwind CSS for modern utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Required custom class and properties as per specifications */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body class="bg-[#ffedf0] min-h-screen flex flex-col justify-between">

    <header class="w-full px-6 py-4 flex items-center justify-between bg-white/80 backdrop-blur-md sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-[#e60023] rounded-full flex items-center justify-center text-white font-bold text-lg">P</div>
            <span class="text-[#e60023] font-bold text-xl tracking-tight">Pinterest</span>
        </div>
        <nav class="hidden md:flex space-x-6 text-sm font-semibold text-gray-700">
            <a href="#" class="hover:text-[#e60023] transition-colors">About</a>
            <a href="#" class="hover:text-[#e60023] transition-colors">Business</a>
            <a href="#" class="hover:text-[#e60023] transition-colors">Press</a>
        </nav>
        <div class="flex space-x-3">
            <a href="#" class="px-4 py-2 text-sm font-semibold text-gray-800 bg-gray-100 hover:bg-gray-200 rounded-full transition-colors">Log in</a>
            <a href="#" class="px-4 py-2 text-sm font-semibold text-white bg-[#e60023] hover:bg-[#ad081b] rounded-full transition-colors">Sign up</a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-6 sm:p-12">
        <div class="hero w-full max-w-6xl bg-white rounded-3xl shadow-xl overflow-hidden flex-col lg:flex-row">
            
            <!-- Left Text Content -->
            <div class="w-full lg:w-1/2 p-8 sm:p-16 flex flex-col justify-center space-y-6">
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold text-gray-900 leading-tight">
                    Get your next <span class="text-[#bd081c] underline decoration-wavy decoration-red-300">weekend project</span> idea
                </h1>
                <p class="text-lg sm:text-xl text-gray-600 font-normal leading-relaxed">
                    Discover recipes, home decor, style inspiration and other ideas to try out with millions of creative thinkers worldwide.
                </p>
                <div>
                    <a href="#explore" class="inline-block px-8 py-4 bg-[#e60023] text-white font-semibold rounded-full shadow-lg hover:bg-[#ad081b] hover:shadow-xl transform hover:-translate-y-0.5 transition-all">
                        Explore Now
                    </a>
                </div>
            </div>

            <!-- Right Image Container adhering to constraints -->
            <div class="w-full lg:w-1/2 h-[350px] sm:h-[450px] lg:h-[600px] relative">
                <img 
                    src="https://images.pexels.com/photos/2662116/pexels-photo-2662116.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" 
                    alt="Inspirational creative workspace and moodboard" 
                    class="w-full h-full object-cover"
                    onerror="this.src='https://placehold.co/800x600/e60023/ffffff?text=Pinterest+Inspiration';"
                />
                <!-- Subtle gradient overlay for extra Pinterest aesthetic -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent pointer-events-none"></div>
            </div>

        </div>
    </main>

    <footer class="w-full py-6 text-center text-xs text-gray-500 bg-white/50 border-t border-gray-100">
        <p>&copy; 2026 Pinterest Clone. Designed with HTML and CSS box model specifications.</p>
    </footer>

</body>
</html>
